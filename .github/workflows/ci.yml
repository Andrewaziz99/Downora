name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check XAML resource keys
        run: python tools/check_xaml_resources.py

      - name: Restore
        run: dotnet restore Downora.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build Downora.sln --configuration Release --no-restore

      - name: Test with coverage
        shell: bash
        run: |
          for project in Core Infrastructure Presentation; do
            dotnet test --project "tests/Downora.${project}.Tests" --configuration Release --no-build               --coverage --coverage-output-format cobertura --coverage-output "cov-${project}.xml" --results-directory TestResults
          done

      - name: Coverage gate
        run: python tools/coverage.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/cov-*.xml
          if-no-files-found: ignore

      - name: Check for missing EF Core migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Downora.Infrastructure --startup-project src/Downora.Infrastructure --configuration Release --no-build
