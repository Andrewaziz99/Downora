name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Downora.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build Downora.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Downora.sln --configuration Release --no-build

      - name: Check for missing EF Core migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Downora.Infrastructure --startup-project src/Downora.Infrastructure --configuration Release --no-build
