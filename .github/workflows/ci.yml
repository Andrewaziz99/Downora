name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check XAML resource keys
        run: python tools/check_xaml_resources.py

      - name: Restore
        run: dotnet restore Downora.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build Downora.sln --configuration Release --no-restore

      - name: Test with coverage
        shell: bash
        run: |
          # Job logs need a GitHub sign-in to read, so failing tests are also reported as annotations (visible to everyone).
          status=0
          for project in Core Infrastructure Presentation; do
            code=0
            dotnet test --project "tests/Downora.${project}.Tests" --configuration Release --no-build               --coverage --coverage-output-format cobertura --coverage-output "cov-${project}.xml" --results-directory TestResults               > "test-${project}.log" 2>&1 || code=$?
            cat "test-${project}.log"
            if [ "$code" -ne 0 ]; then
              status=1
              details=$(grep -A6 -E '^failed ' "test-${project}.log" | head -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              [ -z "$details" ] && details=$(tail -25 "test-${project}.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Tests failed in ${project} (exit ${code})::${details}"
            fi
          done
          exit $status

      - name: Coverage gate
        run: python tools/coverage.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/cov-*.xml
          if-no-files-found: ignore

      - name: Check for missing EF Core migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Downora.Infrastructure --startup-project src/Downora.Infrastructure --configuration Release --no-build
