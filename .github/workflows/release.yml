name: Release

# Builds the installer. Push a tag such as v0.2.0 to publish a GitHub release with the installer and its checksum,
# or run it by hand (Actions > Release > Run workflow) to get the installer as a downloadable build artifact only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 0.2.0). Leave empty to use the version in Directory.Build.props.'
        required: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  installer:
    name: Build installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          elseif ('${{ github.event.inputs.version }}') { $version = '${{ github.event.inputs.version }}' }
          else {
            $props = [xml](Get-Content Directory.Build.props -Raw)
            $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' must look like 1.2.3." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building Downora $version"

      - name: Run the tests
        run: dotnet test --solution Downora.sln --configuration Release

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Signing is optional. Add two repository secrets to turn it on: SIGNING_PFX_BASE64 (the .pfx file, base64) and
      # SIGNING_PFX_PASSWORD. Without them the installer is built unsigned (Windows SmartScreen will warn on first run).
      - name: Import the signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host 'No signing certificate configured; the installer will not be signed.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          "THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer
        shell: pwsh
        run: |
          $params = @{ Version = $env:VERSION; FetchTools = $true }
          if ($env:THUMBPRINT) { $params.CertThumbprint = $env:THUMBPRINT }
          ./installer/build-installer.ps1 @params

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Downora-Setup-${{ env.VERSION }}
          path: |
            artifacts/installer/Downora-Setup-*.exe
            artifacts/installer/Downora-Setup-*.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "artifacts/installer/Downora-Setup-$($env:VERSION).exe" `
            "artifacts/installer/Downora-Setup-$($env:VERSION).exe.sha256" `
            --title "Downora $($env:VERSION)" --generate-notes
